<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена</title>
  <script>
    // Только для GitHub Pages: превращаем /tapreview/b/abc в /tapreview/?slug=abc.
    // На Cloudflare Pages адреса /b/... обрабатывает сервер, поэтому там ничего не делаем.
    if (window.location.hostname.endsWith("github.io")) {
      const repo = "/tapreview";
      let path = window.location.pathname;

      if (path.startsWith(repo)) path = path.slice(repo.length);
      path = path.replace(/^\/+|\/+$/g, "");

      const match = path.match(/^(?:b\/)?([A-Za-z0-9_-]+)$/);

      window.location.replace(
        match ? `${repo}/?slug=${encodeURIComponent(match[1])}` : `${repo}/?slug=`
      );
    }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #f6f7f9;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    p { color: #4b5563; }
  </style>
</head>
<body>
  <div>
    <h1>Страница не найдена</h1>
    <p>Проверьте ссылку или отсканируйте карту ещё раз.</p>
  </div>
</body>
</html>
